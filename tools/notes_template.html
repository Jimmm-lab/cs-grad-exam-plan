<style>
/* Layout: textbook pages — sticky nav across the 5 notes, a table of contents beside one reading column; example / key / trap boxes and quiz answers set off by subject-neutral tints. */
:root {
  --paper: #f5f6f9; --card: #ffffff; --ink: #1a2130; --muted: #5a6376; --line: #dde1e9;
  --accent: #c42f3d; --accent-soft: #fbe8ea;
  --ex: #4450b5; --ex-soft: #eceefb;
  --key: #0d7a74; --key-soft: #e3f4f2;
  --trap: #a86300; --trap-soft: #fbf1e1;
  --ok: #2f7d3b; --ok-soft: #e4f3e6;
  --code: #eef0f5;
  --grid: #e9ecf2;
  --pen-ink: #1a2130; --pen-red: #d0343f; --pen-blue: #2d5fd3; --pen-green: #2f7d3b;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141a; --card: #191d25; --ink: #e5e8ef; --muted: #98a0b0; --line: #2a303b;
    --accent: #ff6d7a; --accent-soft: #3a1d23; --ex: #9aa2ff; --ex-soft: #20233f;
    --key: #4fc6be; --key-soft: #13302e; --trap: #f0aa47; --trap-soft: #35270f;
    --ok: #6fcf7d; --ok-soft: #173320; --code: #222733; color-scheme: dark;
    --grid: #252a35; --pen-ink: #e8ebf2; --pen-red: #ff7b86; --pen-blue: #84a9ff; --pen-green: #74d083;
  }
}
:root[data-theme="dark"] {
  --paper: #11141a; --card: #191d25; --ink: #e5e8ef; --muted: #98a0b0; --line: #2a303b;
  --accent: #ff6d7a; --accent-soft: #3a1d23; --ex: #9aa2ff; --ex-soft: #20233f;
  --key: #4fc6be; --key-soft: #13302e; --trap: #f0aa47; --trap-soft: #35270f;
  --ok: #6fcf7d; --ok-soft: #173320; --code: #222733; color-scheme: dark;
    --grid: #252a35; --pen-ink: #e8ebf2; --pen-red: #ff7b86; --pen-blue: #84a9ff; --pen-green: #74d083;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.8 var(--font-body); }
a { color: var(--accent); }
header.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; gap: 16px; align-items: center; padding-block: 10px; flex-wrap: wrap; }
.home { display: inline-flex; align-items: center; gap: 2px; font: 700 14px/1 var(--font-mono); color: var(--accent); text-decoration: none; white-space: nowrap; }
nav.notes { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav.notes a { text-decoration: none; color: var(--muted); padding: 6px 10px; font-size: 14px; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
nav.notes a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; padding-block: 28px 80px; }
aside.toc { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow-y: auto; font-size: 13px; }
aside.toc .eyebrow { font: 700 11px/1 var(--font-mono); letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
aside.toc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
aside.toc a { color: var(--muted); text-decoration: none; display: block; padding: 3px 0; line-height: 1.5; }
aside.toc a:hover { color: var(--ink); }
.quizbar { margin-top: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.quizbar b { font: 700 18px/1.3 var(--font-mono); display: block; }
.quizbar .wrong-list { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.quizbar .wrong-list a { font: 500 12px/1.6 var(--font-mono); border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 6px; text-decoration: none; }
.quizbar button { margin-top: 8px; font: 500 12px/1 var(--font-body); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
article { min-width: 0; max-width: 760px; }
article h1 { font: 900 30px/1.3 var(--font-display); margin: 0 0 8px; text-wrap: balance; }
article h2 { font: 700 24px/1.4 var(--font-display); margin: 56px 0 12px; padding-top: 16px; border-top: 2px solid var(--ink); text-wrap: balance; scroll-margin-top: 70px; }
article h3 { font: 700 18px/1.5 var(--font-body); margin: 32px 0 8px; scroll-margin-top: 70px; }
article h4 { font: 700 16px/1.5 var(--font-body); margin: 20px 0 6px; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.4em; }
article li { margin: 2px 0; }
article strong { color: var(--ink); }
code { font: 500 0.9em/1.5 var(--font-mono); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; background: var(--code); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.55; }
pre code { background: none; padding: 0; }
.table-wrap, article table { display: block; overflow-x: auto; max-width: 100%; }
article table { border-collapse: collapse; font-size: 14px; margin: 12px 0; }
article th, article td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
article th { background: var(--code); font-weight: 700; white-space: nowrap; }
.admonition, details { border-radius: 8px; padding: 12px 16px; margin: 16px 0; border: 1px solid var(--line); background: var(--card); }
.admonition > :last-child, details > :last-child { margin-bottom: 0; }
.admonition-title, details > summary { font-weight: 700; margin: 0 0 6px; }
.admonition.example { border-left: 4px solid var(--ex); background: var(--ex-soft); }
.admonition.example .admonition-title { color: var(--ex); }
.admonition.key { border-left: 4px solid var(--key); background: var(--key-soft); }
.admonition.key .admonition-title { color: var(--key); }
.admonition.trap { border-left: 4px solid var(--trap); background: var(--trap-soft); }
.admonition.trap .admonition-title { color: var(--trap); }
.admonition.read { border-left: 4px solid var(--muted); }
.admonition.read .admonition-title { color: var(--muted); }
.admonition.read ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
details.quiz { border-style: dashed; }
details.quiz > summary { cursor: pointer; color: var(--accent); margin: 0; list-style: revert; }
details.quiz[open] > summary { margin-bottom: 8px; }
.judge { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.judge button { font: 700 13px/1 var(--font-body); padding: 7px 12px; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.judge button[aria-pressed="true"][data-v="1"] { background: var(--ok); border-color: var(--ok); color: var(--card); }
.judge button[aria-pressed="true"][data-v="0"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.arithmatex { overflow-x: auto; max-width: 100%; overflow-wrap: anywhere; }
div.arithmatex { padding: 4px 0; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
/* 手寫作答板 */
/* 選擇題：選項是一顆顆按鈕，選了馬上顯示對錯 */
.mcq { margin: 18px 0; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.mcq > p:first-child { margin-top: 0; }
.mcq ol { list-style: none; margin: 10px 0 4px; padding: 0; display: grid; gap: 8px; }
.mcq ol li { margin: 0; }
.mcq-opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; line-height: 1.6; text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
.mcq-opt:hover { border-color: var(--muted); }
.mcq-k { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 700 12px/1 var(--font-mono); color: var(--muted); background: var(--card); }
.mcq-opt.right { border-color: var(--ok); background: var(--ok-soft); }
.mcq-opt.right .mcq-k { background: var(--ok); border-color: var(--ok); color: #fff; }
.mcq-opt.wrong { border-color: var(--accent); background: var(--accent-soft); }
.mcq-opt.wrong .mcq-k { background: var(--accent); border-color: var(--accent); color: #fff; }
.mcq-res { margin: 6px 0 4px; font-weight: 700; }
.mcq-res:empty { display: none; }
.mcq-res.ok { color: var(--ok); }
.mcq-res.no { color: var(--accent); }
.mcq .judge { display: none; }
.ink { margin: 12px 0 0; }
.ink + details.quiz { margin-top: 8px; }
.ink-toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ex); font: 500 14px/1 var(--font-body); cursor: pointer; }
.ink-toggle svg { width: 16px; height: 16px; flex: none; }
.ink-toggle.has { border-color: var(--ex); background: var(--ex-soft); }
.ink-toggle[aria-expanded="true"] { border-color: var(--ex); }
.ink-panel { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
.ink-tools { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px; background: var(--paper); border-bottom: 1px solid var(--line); }
.ink-grp { display: flex; gap: 4px; align-items: center; }
.ink-tools button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 36px; min-width: 36px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 13px/1 var(--font-body); cursor: pointer; }
.ink-tools .ico { width: 18px; height: 18px; }
.ink-tools .ink-zl { min-width: 52px; font: 600 12px/1 var(--font-mono); }
.ink-hint { flex: 1 0 100%; }
.ink-tools button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 700; }
.ink-tools button:disabled { opacity: .4; cursor: default; }
.ink-tools .ink-sw { padding: 0; display: inline-grid; place-items: center; }
.ink-sw span { display: block; width: 18px; height: 18px; border-radius: 50%; }
/* 筆的種類：圖示＋小字，一眼分得出來 */
.ink-tools .ink-tool { flex-direction: column; gap: 2px; width: 48px; min-width: 48px; min-height: 50px; padding: 4px 0 3px; font: 500 11px/1.1 var(--font-body); }
/* 選取後浮在選取範圍旁邊的操作列 */
.ink-sheet { position: relative; }
.ink-selbar { position: absolute; z-index: 3; left: 0; top: 0; display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); box-shadow: 0 6px 18px rgba(10, 15, 30, .18); transition: opacity .12s; }
.ink-selbar[hidden] { display: none; }
.ink-selbar.dragging { opacity: 0; pointer-events: none; }
.ink-selinfo { padding: 0 6px; font: 700 12.5px/1 var(--font-body); color: var(--muted); white-space: nowrap; }
.ink-selbar button { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; min-width: 36px; justify-content: center; padding: 0 9px; border-radius: 7px; border: 0; background: none; color: var(--ink); font: 500 13px/1 var(--font-body); white-space: nowrap; cursor: pointer; }
.ink-selbar button:hover { background: var(--paper); }
.ink-selbar button[data-sel="del"] { color: var(--accent); }
.ink-selbar .ico { width: 17px; height: 17px; }
.ink-tools .ink-tool .ico { width: 20px; height: 20px; }
/* 「● 數字」：現在這支筆的顏色和粗細，按了打開設定 */
.ink-tools .ink-cur { gap: 6px; padding: 0 10px; min-width: 52px; }
.ink-cur i { display: block; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.ink-cur b { font: 600 12px/1 var(--font-mono); }
.ink-cur[aria-expanded="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
/* 粗細和顏色的設定面板（在工具列下面展開） */
.ink-cfg { display: grid; gap: 12px; padding: 12px; border-bottom: 1px solid var(--line); background: var(--card); }
.ink-cfg[hidden] { display: none; }
.ink-cfg-head { display: flex; align-items: center; gap: 8px; }
.ink-cfg-head b { font: 700 14.5px/1.3 var(--font-body); }
.ink-cfg-head span { font-size: 12.5px; color: var(--muted); }
.ink-cfg-x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ink-cfg-x .ico { width: 16px; height: 16px; }
.ink-w { display: grid; grid-template-columns: auto 1fr 2.6em; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.ink-w input { width: 100%; min-height: 32px; accent-color: var(--ink); }
.ink-w output { font: 600 13px/1 var(--font-mono); color: var(--ink); text-align: right; }
.ink-prev { display: block; width: 100%; height: 48px; border: 1px dashed var(--line); border-radius: 8px; background: var(--card); }
.ink-pal { display: grid; grid-template-columns: 4em 1fr; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ink-pal > div { display: flex; flex-wrap: wrap; gap: 4px; }
.ink-pal button { width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; background: none; cursor: pointer; }
.ink-pal button span { display: block; width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.ink-pal button[aria-pressed="true"] span { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
.ink-custom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; font-size: 13px; color: var(--muted); }
.ink-custom label { display: inline-flex; align-items: center; gap: 8px; }
.ink-custom input[type="color"] { width: 46px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
.ink-custom button { border: 0; padding: 6px 0; background: none; color: var(--muted); font: 400 12.5px/1.4 var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.ink-canvas { display: block; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background-color: var(--card); }
.ink-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.5; color: var(--muted); }
.ink-pen { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.ink-pen input { width: 18px; height: 18px; margin: 0; accent-color: var(--ex); }

/* 資料結構動畫 */
.viz { margin: 20px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--card); overflow: hidden; }
.vz-head { padding: 10px 14px 0; font-weight: 700; line-height: 1.5; }
.vz-tag { display: inline-block; margin-right: 8px; padding: 1px 8px; border-radius: 4px; background: var(--ex); color: var(--card); font: 700 12px/1.6 var(--font-body); vertical-align: 1px; }
.vz-form { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; padding: 8px 14px 12px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.4; }
.vz-form label { display: grid; gap: 3px; flex: 1 1 180px; min-width: 0; color: var(--muted); }
.vz-form input, .vz-form select { width: 100%; min-width: 0; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: 500 14px/1.4 var(--font-mono); }
.vz-form select { font-family: var(--font-body); }
.vz-formbtn { display: flex; gap: 6px; }
.vz-form button, .vz-ctrl button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 38px; min-width: 38px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 14px/1 var(--font-body); cursor: pointer; white-space: nowrap; }
.vz-ctrl .ico { width: 18px; height: 18px; }
.vz-ctrl [data-a="first"] { padding: 0 8px; }
.vz-form button[type="submit"] { border-color: var(--ex); color: var(--ex); }
.vz-stage { overflow-x: auto; padding: 12px 10px; }
.vz-svg { display: block; width: 100%; height: auto; margin: 0 auto; }
.vz-cap { padding: 10px 14px; border-top: 1px solid var(--line); background: var(--ex-soft); min-height: 4.4em; line-height: 1.7; }
.vz-error .vz-cap { background: var(--accent-soft); }
.vz-info { padding: 8px 14px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); overflow-x: auto; }
.vz-ctrl { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 10px 14px 12px; border-top: 1px solid var(--line); }
.vz-ctrl button:disabled { opacity: .4; cursor: default; }
.vz-ctrl .vz-next { border-color: var(--ex); color: var(--ex); font-weight: 700; }
.vz-count { font: 500 13px/1 var(--font-mono); color: var(--muted); margin-left: auto; }
.vz-range { flex: 1 0 100%; margin: 4px 0 0; accent-color: var(--ex); }
.vz-ok { color: var(--ok); font-weight: 700; }
.vz-l { color: var(--key); font-weight: 700; }
.vz-r { color: var(--trap); font-weight: 700; }
.vz-tbl { border-collapse: collapse; margin: 4px 0; font: 500 13px/1.4 var(--font-mono); }
.vz-tbl th, .vz-tbl td { border: 1px solid var(--line); padding: 2px 8px; text-align: center; }
.vz-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.vz-chip { font: 500 12px/1.6 var(--font-mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); }
.vz-chip.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.vz-chip.skip { text-decoration: line-through; opacity: .55; }
.vz-chip.hit { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.vz-svg text { font: 600 15px var(--font-mono); fill: var(--ink); }
.vz-svg .vz-sub, .vz-svg .vz-note { font: 500 12px var(--font-mono); fill: var(--muted); }
.vz-svg .vz-note { font-weight: 700; }
.vz-svg g { transition: transform .5s ease, opacity .3s ease; }
.vz-svg .vz-enter, .vz-svg .vz-leave { opacity: 0; }
.vz-box rect, .vz-node circle { fill: var(--card); stroke: var(--muted); stroke-width: 1.5; transition: fill .25s, stroke .25s; }
.vz-zone rect { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 4; }
.vz-edge path { fill: none; stroke: var(--muted); stroke-width: 2; transition: d .5s ease, stroke .25s, stroke-width .25s, opacity .25s; }
.vz-box.slot rect { fill: var(--paper); stroke: var(--line); }
.vz-box.cur rect, .vz-node.cur circle { fill: var(--ex-soft); stroke: var(--ex); stroke-width: 3; }
.vz-box.cmp rect, .vz-node.cmp circle { fill: var(--trap-soft); stroke: var(--trap); stroke-width: 2.5; }
.vz-box.done rect, .vz-node.done circle { fill: var(--ok-soft); stroke: var(--ok); }
.vz-box.bad rect, .vz-node.bad circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.vz-box.dim { opacity: .4; }
.vz-node.path circle { stroke: var(--ex); stroke-dasharray: 4 3; stroke-width: 2.5; }
.vz-box.lpart rect { fill: var(--key-soft); stroke: var(--key); stroke-width: 2.5; }
.vz-box.rpart rect { fill: var(--trap-soft); stroke: var(--trap); stroke-width: 2.5; }
.vz-box.dup rect { fill: var(--trap-soft); stroke: var(--trap); }
.vz-box.memo rect { fill: var(--ok-soft); stroke: var(--ok); stroke-dasharray: 5 3; }
.vz-node.bad .vz-note { fill: var(--accent); }
.vz-edge.on path { stroke: var(--accent); stroke-width: 5; }
.vz-edge.cand path { stroke: var(--trap); stroke-width: 3; stroke-dasharray: 7 5; }
.vz-edge.bad path { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 3 4; }
.vz-edge.skip path { opacity: .25; stroke-dasharray: 2 5; }
.vz-svg .vz-w text { font: 700 13px var(--font-mono); fill: var(--muted); paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
.vz-svg .vz-w.on text { fill: var(--accent); }
.vz-svg .vz-w.skip text { opacity: .4; }
.vz-svg .vz-hl { fill: var(--trap); font-weight: 800; }
.vz-svg .vz-dimtxt { fill: var(--muted); opacity: .6; }
.vz-node.dim { opacity: .45; }
.vz-node.side2 circle { fill: var(--key-soft); stroke: var(--key); stroke-width: 2.5; }
.vz-static .vz-form, .vz-static .vz-ctrl, .vz-static .vz-cap:empty { display: none; }
.vz-static .vz-tag { background: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .vz-svg g, .vz-edge path { transition: none; }

/* 圖示 */
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
article .ico-ok { color: var(--ok); }
article .ico-no { color: var(--accent); }
article .ico-star { color: var(--trap); width: 1em; height: 1em; vertical-align: -0.12em; }
article [id] { scroll-margin-top: 70px; }
section.unit > :first-child { margin-top: 0; }
section.unit > h2:first-child, section.unit > h1 + p + h2 { margin-top: 0; }

/* 目錄：現在的單元與它的小節 */
aside.toc a.cur { color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); padding-left: 9px; }
/* 目錄的小節：按單元右邊的箭頭展開（高度和內容一起快速往下浮現） */
aside.toc .toc li.has-sub { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: 2px; }
.toc-tg { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.toc-tg:hover { background: var(--code); color: var(--ink); }
.toc-tg .ico { width: 16px; height: 16px; transition: transform .22s ease; }
li.open > .toc-tg { color: var(--ink); }
li.open > .toc-tg .ico { transform: rotate(180deg); }
.toc-subw { grid-column: 1 / -1; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .24s ease; }
li.open > .toc-subw { grid-template-rows: 1fr; }
.toc-subi { min-height: 0; overflow: hidden; opacity: 0; transform: translateY(-8px); visibility: hidden; transition: opacity .16s ease, transform .24s ease, visibility 0s linear .24s; }
li.open > .toc-subw > .toc-subi { opacity: 1; transform: none; visibility: visible; transition: opacity .2s ease .03s, transform .24s ease; }
aside.toc .toc-sub { list-style: none; margin: 2px 0 8px 12px; padding: 0; display: grid; gap: 0; border-left: 1px solid var(--line); }
aside.toc .toc-sub a { padding: 3px 0 3px 10px; font-size: 12.5px; position: relative; transition: color .15s; }
/* 現在讀到的小節：粗體、深色字，左邊的線變成紅色 */
aside.toc .toc-sub a.cur-sub { color: var(--ink); font-weight: 700; }
aside.toc .toc-sub a.cur-sub::before { content: ""; position: absolute; left: -1.5px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--accent); }
aside.toc.toc-instant .toc-subw, aside.toc.toc-instant .toc-subi, aside.toc.toc-instant .toc-tg .ico { transition: none !important; }
aside.toc .toc > ul > li.has-sub > a.cur { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .toc-subw, .toc-subi, .toc-tg .ico { transition: none !important; } }
.toc-head { display: none; }

/* 換單元 */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 56px 0 0; padding-top: 18px; border-top: 1px solid var(--line); }
.pager a { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); text-decoration: none; line-height: 1.45; font-weight: 700; font-size: 15px; }
.pager a:hover { border-color: var(--accent); }
.pager a small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.pager .pg-next { justify-content: flex-end; text-align: right; }
.pager .ico { width: 20px; height: 20px; color: var(--accent); }

/* 右下角按鈕 */
.fab { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; z-index: 18; transition: opacity .2s; }
.fab button { box-sizing: border-box; width: 46px; height: 46px; margin-top: 10px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 10px rgba(10, 15, 30, .16); }
.fab button:first-child { margin-top: 0; }
.fab button .ico { width: 22px; height: 22px; }
.fab .fab-toc { display: none; background: var(--ink); color: var(--card); border-color: var(--ink); }
.fab.fab-off { opacity: 0; pointer-events: none; }
/* 收起來的按鈕：高度和間距一起縮成 0，下面的按鈕往下補位，不會留一個空格 */
.fab button { transition: opacity .18s ease, transform .22s ease, height .22s ease, margin-top .22s ease; }
.fab button.is-off { height: 0; margin-top: 0; opacity: 0; transform: scale(.4); visibility: hidden; pointer-events: none; border-width: 0; box-shadow: none; transition: opacity .14s ease, transform .22s ease, height .22s ease, margin-top .22s ease, visibility 0s linear .22s, border-width 0s linear .22s, box-shadow 0s linear .22s; }
@media (prefers-reduced-motion: reduce) { .fab button, .fab button.is-off { transition: none; } }
.toc-backdrop { display: none; }

/* 手寫筆跡備份 */
.inkbak { margin-top: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.inkbak p { margin: 6px 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.inkbak-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.inkbak button { display: inline-flex; align-items: center; gap: 4px; font: 500 12.5px/1 var(--font-body); background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 7px 9px; cursor: pointer; }
.inkbak .inkbak-msg:empty { display: none; }
.sync-form { display: grid; gap: 6px; margin: 6px 0; }
.sync-form input { width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: 500 15px/1.4 var(--font-body); }
.sync-form button[type="submit"] { justify-content: center; min-height: 38px; }
.inkbak .linkish { border: 0; padding: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 12px; }
.inkbak b { color: var(--ink); word-break: break-all; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 16px; padding-bottom: 180px; }
  aside.toc { position: fixed; top: var(--hdr, 52px); left: 8px; right: 8px; z-index: 30; max-height: calc(100vh - var(--hdr, 52px) - 14px); max-height: calc(100dvh - var(--hdr, 52px) - 14px); margin: 0; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px; box-shadow: 0 16px 32px rgba(5, 8, 15, .25); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; font-size: 14.5px; opacity: 0; transform: translateY(-16px); clip-path: inset(0 -24px 100% -24px); visibility: hidden; transition: clip-path .32s ease, transform .32s ease, opacity .2s ease, visibility 0s linear .32s; }
  body.toc-open aside.toc { opacity: 1; transform: none; clip-path: inset(0 -24px -48px -24px); visibility: visible; transition: clip-path .32s ease, transform .32s ease, opacity .2s ease; }
  aside.toc a { padding: 7px 0; }
  .toc-tg { width: 40px; height: 37px; }
  .toc-tg .ico { width: 18px; height: 18px; }
  aside.toc .toc-sub a { padding: 6px 0 6px 12px; font-size: 13.5px; }
  .toc-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; margin: 0 -16px 8px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); z-index: 1; }
  .toc-head .eyebrow { margin: 0; }
  aside.toc > .eyebrow { display: none; }
  .toc-close { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--card); color: var(--ink); cursor: pointer; }
  .toc-close .ico { width: 20px; height: 20px; }
  .toc-backdrop { display: block; position: fixed; inset: var(--hdr, 52px) 0 0 0; z-index: 25; background: rgba(5, 8, 15, .45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  body.toc-open .toc-backdrop { opacity: 1; pointer-events: auto; }
  html.toc-lock { overflow: hidden; overscroll-behavior: none; }
  .fab .fab-toc { display: grid; }
  @media (prefers-reduced-motion: reduce) { aside.toc, body.toc-open aside.toc { transition: none; } }
  article h1 { font-size: 25px; }
  .pager { grid-template-columns: 1fr; }
  .pager .pg-next { grid-row: 1; }
}
@media (max-width: 700px) {
  body { font-size: 15.5px; }
  article table { font-size: 14px; }
  article th, article td { padding: 6px 8px; }
  article th { white-space: normal; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  article code { overflow-wrap: anywhere; }
  .admonition, details { padding: 10px 12px; }
  article ul, article ol { padding-left: 1.2em; }
  .vz-stage { padding: 10px 4px; }
  div.arithmatex { margin-left: -8px; margin-right: -8px; }
  /* 欄位多、列數少的表：轉成直的（nav.js 加 .tbl-t） */
  article table.tbl-t tr:first-child > * { background: var(--code); font-weight: 700; }
  /* 文字多的表：每一列變成一張卡片，欄位名稱寫在左邊（nav.js 加 .tbl-stack） */
  article table.tbl-stack { display: block; border: 0; overflow: visible; font-size: 15px; }
  .tbl-stack thead { display: none; }
  .tbl-stack tbody { display: grid; gap: 10px; }
  .tbl-stack tr { display: block; border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
  .tbl-stack tr > * { display: grid; grid-template-columns: minmax(4.6em, 30%) minmax(0, 1fr); gap: 4px 10px; align-items: baseline; border: 0; border-top: 1px solid var(--line); padding: 7px 12px; white-space: normal; }
  .tbl-stack tr > :first-child { border-top: 0; background: var(--code); font-weight: 700; }
  .tbl-stack tr > *::before { content: attr(data-label); font: 700 12.5px/1.6 var(--font-body); color: var(--muted); }
  .tbl-stack tr > :not([data-label]) { grid-template-columns: minmax(0, 1fr); }
  .tbl-stack tr > :not([data-label])::before { content: none; }
}

<script>
// MathJax 4：太長的公式自動換行（手機上不用左右滑）。只排版正在看的單元（nav.js 負責），開頁面比較快。
window.MathJax = {
  tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
  options: {
    processHtmlClass: "arithmatex", ignoreHtmlClass: ".*",
    enableMenu: false, enableEnrichment: false, enableSpeech: false, enableBraille: false, enableExplorer: false,
    menuOptions: { settings: { enrich: false, speech: false, braille: false, collapsible: false, assistiveMml: false } }
  },
  output: { displayOverflow: "linebreak", linebreaks: { inline: true, width: "100%" } },
  svg: { fontCache: "global" },
  startup: { typeset: false, pageReady: function () { return MathJax.startup.defaultPageReady().then(function () { document.dispatchEvent(new Event("cgep:mathjax")); }); } }
};
</script>

<body data-slug="{{SLUG}}" data-split="{{SPLIT}}">
<header class="top"><div class="wrap top-row">
  <a class="home" href="../index.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg>備考計畫</a>
  <nav class="notes" aria-label="教材">{{NAV}}</nav>
</div></header>
<div class="wrap layout">
  <aside class="toc">
    <div class="eyebrow">目錄</div>
    {{TOC}}
    <div class="quizbar" id="quizbar" hidden>
      <div class="eyebrow">本頁小考</div>
      <b id="qb-num">0 / 0</b>
      <span id="qb-txt" style="color:var(--muted)">已作答</span>
      <div class="wrong-list" id="qb-wrong"></div>
      <button type="button" id="qb-reset">清除本頁紀錄</button>
    </div>
  </aside>
  <article>
{{BODY}}
  </article>
</div>
<script>
(function () {
  var KEY = "cgep:quiz:{{SLUG}}";
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
  function save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} if (window.CGEP_STATE) window.CGEP_STATE.touch(KEY); }
  var rec = load();
  var quizzes = Array.prototype.slice.call(document.querySelectorAll("details.quiz"));
  var seen = {};
  quizzes.forEach(function (d, i) {
    var label = "Q" + (i + 1);
    // 選擇題整題包在 .mcq 裡：題號從外框的第一段拿，往前找標題也從外框開始
    var box = d.closest(".mcq");
    var prev = box ? box.querySelector("p") : d.previousElementSibling;
    if (prev) { var s = prev.querySelector("strong"); if (s) label = s.textContent.replace(/[.．。:：]$/, "").slice(0, 16); }
    // 穩定的 id：前一個有 id 的標題 + 在該標題下的第幾題（之後插入新內容也不會打亂舊紀錄）。
    // 後來插進舊題目前面的題目，用 <div data-qid="..."> 給固定的 id，不算進編號，舊題目的 id 就不會變
    var fixed = d.closest("[data-qid]"), id;
    if (fixed) id = "q-" + fixed.dataset.qid;
    else {
      var h = (box || d).previousElementSibling;
      while (h && !(/^H[23]$/.test(h.tagName) && h.id)) h = h.previousElementSibling;
      var base = h ? h.id : "top";
      seen[base] = (seen[base] || 0) + 1;
      id = "q-" + base + "-" + seen[base];
    }
    d.id = id; d.dataset.label = label;
    var bar = document.createElement("div");
    bar.className = "judge";
    bar.innerHTML = '<span>自己對答案：</span><button type="button" data-v="1">答對了</button><button type="button" data-v="0">答錯了，記錯題</button>';
    d.appendChild(bar);
    bar.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { rec[id] = +b.dataset.v; save(rec); paint(); });
    });
  });
  function paint() {
    var done = 0, wrong = [];
    quizzes.forEach(function (d) {
      var v = rec[d.id];
      d.querySelectorAll(".judge button").forEach(function (b) { b.setAttribute("aria-pressed", String(v !== undefined && +b.dataset.v === v)); });
      if (v !== undefined) done++;
      if (v === 0) wrong.push(d);
    });
    var bar = document.getElementById("quizbar");
    if (!quizzes.length) return;
    bar.hidden = false;
    document.getElementById("qb-num").textContent = done + " / " + quizzes.length;
    document.getElementById("qb-txt").textContent = "已作答，答錯 " + wrong.length + " 題";
    document.getElementById("qb-wrong").innerHTML = wrong.map(function (d) { return '<a href="#' + d.id + '">' + d.dataset.label + "</a>"; }).join("");
  }
  // 選擇題：.mcq 裡的編號清單變成可以點的選項，選了馬上對答案，並記成「答對／答錯」（跟小考紀錄一樣）
  var mcqs = [];
  Array.prototype.forEach.call(document.querySelectorAll(".mcq"), function (box) {
    var d = box.querySelector("details.quiz"), ol = box.querySelector("ol");
    if (!d || !ol) return;
    var ans = +box.dataset.ans, opts = Array.prototype.slice.call(ol.children);
    var res = document.createElement("p");
    res.className = "mcq-res";
    res.setAttribute("aria-live", "polite");
    ol.parentNode.insertBefore(res, ol.nextSibling);
    opts.forEach(function (li, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "mcq-opt";
      b.innerHTML = '<span class="mcq-k">' + "ABCDEFGH".charAt(i) + "</span><span>" + li.innerHTML + "</span>";
      li.innerHTML = "";
      li.appendChild(b);
      b.addEventListener("click", function () {
        var ok = i + 1 === ans;
        rec[d.id] = ok ? 1 : 0; save(rec); paint();
        show(i + 1);
        res.textContent = ok ? "答對了！" : "答錯了，正確答案是 " + "ABCDEFGH".charAt(ans - 1) + "，看下面的解析。";
        res.className = "mcq-res " + (ok ? "ok" : "no");
        d.open = true;
      });
    });
    // chosen：剛選的選項；0 表示「之前已經作答過」，只標出正確答案
    function show(chosen) {
      opts.forEach(function (li, i) {
        var b = li.firstChild, n = i + 1;
        b.classList.toggle("right", chosen != null && n === ans);
        b.classList.toggle("wrong", chosen != null && n === chosen && n !== ans);
        b.setAttribute("aria-pressed", String(n === chosen));
      });
    }
    function restore() {
      res.textContent = ""; res.className = "mcq-res";
      show(rec[d.id] !== undefined ? 0 : null);
    }
    restore();
    mcqs.push(restore);
  });
  document.getElementById("qb-reset").addEventListener("click", function () { rec = {}; save(rec); paint(); mcqs.forEach(function (f) { f(); }); });
  // 雲端同步下來新的紀錄，或換了帳號
  document.addEventListener("cgep:state-remote", function (e) { if (e.detail.wiped || (e.detail.keys || []).indexOf(KEY) >= 0) { rec = load(); paint(); mcqs.forEach(function (f) { f(); }); } });
  paint();
})();
</script>
