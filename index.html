<style>
/* Layout: answer-sheet notebook — a sticky header with the D-day counter, tabbed views, one column of day rows; subject colours mark the three exam papers. */
:root {
  --paper: #f5f6f9;
  --card: #ffffff;
  --ink: #1a2130;
  --muted: #5a6376;
  --line: #dde1e9;
  --accent: #c42f3d;        /* answer-card red */
  --accent-soft: #fbe8ea;
  --dm: #4450b5;  --dm-soft: #e8eafa;
  --ca: #0d7a74;  --ca-soft: #e0f3f1;
  --os: #a86300;  --os-soft: #fbf0df;
  --ok: #2f7d3b;  --ok-soft: #e4f3e6;
  --warn: #9a5b00;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141a; --card: #191d25; --ink: #e5e8ef; --muted: #98a0b0; --line: #2a303b;
    --accent: #ff6d7a; --accent-soft: #3a1d23;
    --dm: #9aa2ff; --dm-soft: #23264a; --ca: #4fc6be; --ca-soft: #143331; --os: #f0aa47; --os-soft: #3a2a12;
    --ok: #6fcf7d; --ok-soft: #173320; --warn: #f0aa47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141a; --card: #191d25; --ink: #e5e8ef; --muted: #98a0b0; --line: #2a303b;
  --accent: #ff6d7a; --accent-soft: #3a1d23;
  --dm: #9aa2ff; --dm-soft: #23264a; --ca: #4fc6be; --ca-soft: #143331; --os: #f0aa47; --os-soft: #3a2a12;
  --ok: #6fcf7d; --ok-soft: #173320; --warn: #f0aa47;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.7 var(--font-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
a { color: var(--accent); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* header */
header.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-row { display: flex; align-items: center; gap: 16px; padding-block: 14px 10px; flex-wrap: wrap; }
.dday { display: flex; align-items: baseline; gap: 6px; color: var(--accent); }
.dday b { font: 700 34px/1 var(--font-mono); letter-spacing: -1px; }
.dday span { font: 700 13px/1 var(--font-mono); }
.title-block { min-width: 0; flex: 1; }
.title-block h1 { font: 900 20px/1.3 var(--font-display); margin: 0; text-wrap: balance; }
.title-block p { margin: 0; color: var(--muted); font-size: 13px; }
.exam-pick select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px; font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }
nav.tabs a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 24px 64px; }
h2 { font: 700 22px/1.35 var(--font-display); margin: 0 0 12px; text-wrap: balance; }
h3 { font: 700 16px/1.4 var(--font-body); margin: 0; }
.eyebrow { font: 700 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); margin: 0 0 20px; max-width: 65ch; }
section.view { display: grid; gap: 28px; }

/* subject chips */
.subj { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.subj[data-s="dm"] { color: var(--dm); background: var(--dm-soft); }
.subj[data-s="ca"] { color: var(--ca); background: var(--ca-soft); }
.subj[data-s="osds"] { color: var(--os); background: var(--os-soft); }
.weak-mark { font-size: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; line-height: 1.4; }

/* summary strip */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.fact { background: var(--card); padding: 14px 16px; min-width: 0; }
.fact .v { font: 700 20px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.fact .k { color: var(--muted); font-size: 12px; }
.fact .v.behind { color: var(--accent); }
.fact .v.good { color: var(--ok); }

/* today */
.today-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.today-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.today-head .date { font: 700 13px/1 var(--font-mono); color: var(--muted); }
.today-head h3 { font: 700 20px/1.4 var(--font-display); margin-top: 6px; }
.blocks { display: grid; }
.block { display: grid; grid-template-columns: 92px 1fr; gap: 16px; padding: 16px 20px; border-top: 1px solid var(--line); }
.block:first-child { border-top: 0; }
.block .when { font: 700 13px/1.6 var(--font-mono); color: var(--muted); display: grid; gap: 6px; align-content: start; }
.block .what { min-width: 0; }
.block .what h4 { margin: 0 0 4px; font-size: 16px; }
.block dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
.block dt { color: var(--muted); }
.block dd { margin: 0; min-width: 0; }
.note { margin: 0; padding: 12px 20px; background: var(--accent-soft); font-size: 14px; border-top: 1px solid var(--line); }
.done-btn { font: 700 14px/1 var(--font-body); padding: 10px 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.done-btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--card); }
.rest-card { background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); padding: 20px; }

/* milestones */
.ms-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-left: 2px solid var(--line); }
.ms-list li { position: relative; padding: 4px 0 12px 18px; display: grid; grid-template-columns: 150px 1fr; gap: 10px; }
.ms-list li::before { content: ""; position: absolute; left: -6px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--muted); }
.ms-list li.past { color: var(--muted); }
.ms-list li.next::before { background: var(--accent); border-color: var(--accent); }
.ms-list li .d { font: 700 13px/1.7 var(--font-mono); }
.ms-list li span:last-child { min-width: 0; }

/* phases bar */
.phasebar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.phasebar div { background: var(--line); position: relative; }
.phasebar div.cur { background: var(--accent); }
.phasebar div.past { background: var(--muted); opacity: .45; }
.phase-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.phase-legend b { color: var(--ink); }

/* plan list */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.toolbar .lbl { font-size: 13px; color: var(--muted); }
.wd-pick { display: flex; gap: 4px; flex-wrap: wrap; }
.wd-pick button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 14px/1 var(--font-body); cursor: pointer; }
.wd-pick button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn { font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.tb-msg { font-size: 13px; color: var(--warn); }

.week { display: grid; gap: 0; }
.week-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 0 2px 6px; flex-wrap: wrap; }
.week-h .eyebrow { color: var(--ink); }
.week-h .pc { font-size: 12px; color: var(--muted); }
.days { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.day { display: grid; grid-template-columns: 30px 82px 1fr; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: start; }
.day:first-child { border-top: 0; }
.day.is-today { background: var(--accent-soft); }
.day.rest { padding-block: 8px; color: var(--muted); }
.day.rest .main { font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.day .dt { font: 700 13px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; }
.day .dt small { display: block; font: 500 12px/1.4 var(--font-body); color: var(--muted); }
.day .main { min-width: 0; display: grid; gap: 6px; }
.day .t { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font: 700 11px/1.6 var(--font-mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.tag.ms { border-color: var(--accent); color: var(--accent); }
.tag.opt { border-style: dashed; }
.tag.late { border-color: var(--accent); color: var(--accent); }
.day.late { box-shadow: inset 3px 0 0 var(--accent); }

/* 你的計畫 */
.myplan { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.mp-top { display: flex; gap: 12px 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.myplan h3 { margin: 4px 0 2px; font-size: 19px; }
.mp-sub { margin: 0; font-size: 13px; color: var(--muted); }
.mp-start { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.mp-start input { font: 500 15px/1.2 var(--font-mono); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); min-height: 40px; }
.mp-desc { margin: 0; font-size: 14px; line-height: 1.75; }
.mp-adj summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }
.mp-adj ol { margin: 8px 0 0; padding-left: 1.4em; font-size: 13.5px; line-height: 1.7; }
.mp-tracks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.mp-tracks li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.mp-tracks li.cur { border-color: var(--accent); background: var(--accent-soft); }
.mp-tracks b { margin-right: 8px; }
.mp-tracks span { font: 500 12px/1 var(--font-mono); color: var(--muted); }
.mp-tracks p { margin: 4px 0 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
.plan-link { color: inherit; text-decoration: none; border-bottom: 2px solid var(--accent-soft); }

/* 補進度 */
.catchup { background: var(--card); border: 1px solid var(--accent); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.catchup h3 { margin: 4px 0 0; font-size: 17px; }
.cu-rule { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.75; }
.cu-plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.cu-plan > li { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.cu-plan > li:first-child { border-top: 0; padding-top: 0; }
.cu-when b { display: block; font: 700 14px/1.5 var(--font-mono); }
.cu-when span { display: block; font-size: 12px; line-height: 1.5; color: var(--muted); }
.cu-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cu-item { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.6; cursor: pointer; }
.cu-item input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.cu-item b { font: 700 13px/1.6 var(--font-mono); margin-right: 6px; }
.cu-links { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 4px 0 0 26px; font-size: 12.5px; }
.cu-links a { color: var(--muted); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.cu-links a:hover { color: var(--accent); }
.cu-left { margin: 0; font-size: 13.5px; line-height: 1.7; padding: 10px 12px; background: var(--accent-soft); border-radius: 6px; }
.catchup details summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }
.catchup details[open] summary { margin-bottom: 12px; }
.cu-more { margin: 0; font-size: 13px; }
@media (max-width: 560px) { .cu-plan > li { grid-template-columns: 1fr; gap: 6px; } .cu-when b, .cu-when span { display: inline; margin-right: 8px; } }
.day .items { display: grid; gap: 3px; font-size: 14px; }
.day .items div { display: grid; grid-template-columns: 76px 1fr; gap: 8px; min-width: 0; }
.day .items .subj { justify-self: start; }
.day .items span:last-child { min-width: 0; }
.chk { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); margin: 2px 0 0; cursor: pointer; display: grid; place-content: center; background: var(--card); }
.chk:checked { background: var(--accent); border-color: var(--accent); }
.chk:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--card); }
.day.done .main { opacity: .55; }
.day.exam { background: var(--accent); color: var(--card); }
.day.exam .dt small { color: var(--card); opacity: .8; }

/* review */
.review { padding: 14px 20px; border-top: 1px solid var(--line); }
.review ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.review li { display: grid; grid-template-columns: 84px 1fr; gap: 8px; font-size: 14px; align-items: start; }
.review li .subj { justify-self: start; }
.review li span:last-child { min-width: 0; }
.review a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line); }
.review a:hover { color: var(--accent); }
.flow { margin: 0; padding: 12px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.flow b { color: var(--ink); }
.flow a { margin-left: 4px; }
.rv-line { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .review li { grid-template-columns: 1fr; gap: 2px; } }

/* notes */
.ncards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.ncard { display: grid; gap: 6px; align-content: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-decoration: none; color: var(--ink); min-width: 0; }
.ncard:hover { border-color: var(--muted); }
.ncard h3 { font: 700 18px/1.4 var(--font-display); }
.ncard p { margin: 0; color: var(--muted); font-size: 14px; }
.ncard .subj { justify-self: start; }
.nprog { font-size: 12px; color: var(--accent); }
.subj[data-s="method"] { color: var(--accent); background: var(--accent-soft); }
.nlink { display: inline-block; margin-top: 6px; font-weight: 700; font-size: 14px; }
.day .items a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
.day .items a:hover { color: var(--accent); }

/* papers */
.sheet-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
table.sheet { border-collapse: collapse; width: 100%; font-size: 14px; }
.sheet th, .sheet td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; }
.sheet th:first-child, .sheet td:first-child { text-align: left; }
.sheet thead th { font-weight: 700; font-size: 13px; position: sticky; top: 0; background: var(--card); }
.sheet tr:last-child td { border-bottom: 0; }
.sheet .yr { font: 700 14px/1 var(--font-mono); }
.sheet .role { font-size: 11px; color: var(--accent); margin-left: 6px; font-weight: 700; }
.bubble { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font: 700 12px/1 var(--font-mono); }
.bubble[data-st="1"] { border-color: var(--muted); background: linear-gradient(90deg, var(--muted) 50%, transparent 50%); }
.bubble[data-st="2"] { border-color: var(--accent); background: var(--accent); }
.bubble[data-st="3"] { border-color: var(--ok); background: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); align-items: center; }
.legend .bubble { width: 18px; height: 18px; cursor: default; vertical-align: middle; margin-right: 4px; }

/* strategy */
.strat { display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.strat article { padding: 18px 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
.strat article:first-child { border-top: 0; }
.strat .n { font: 700 16px/1.5 var(--font-mono); color: var(--accent); }
.strat p { margin: 4px 0 0; max-width: 68ch; }
.strat .src { font-size: 12px; color: var(--muted); margin-top: 4px; }
.strat article > div { min-width: 0; }
.res { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.res > div { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.res ul, .src-list { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.src-list { font-size: 14px; }
.subjects-row { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 560px) {
  .block { grid-template-columns: 1fr; gap: 6px; }
  .block .when { display: flex; gap: 8px; align-items: center; }
  .day { grid-template-columns: 26px 1fr; }
  .day .dt { grid-column: 2; }
  .day .main { grid-column: 2; }
  .day .chk { grid-row: 1; }
  .day .items div { grid-template-columns: 1fr; gap: 0; }
  .ms-list li { grid-template-columns: 1fr; gap: 0; }
  .dday b { font-size: 28px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.ico-star { color: var(--accent); width: 1em; height: 1em; vertical-align: -0.12em; }
.done-btn .ico { margin-right: 4px; }
.fab { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; z-index: 18; }
.fab button { box-sizing: border-box; width: 46px; height: 46px; margin-top: 10px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 10px rgba(10, 15, 30, .16); }
.fab button:first-child { margin-top: 0; }
.fab .ico { width: 22px; height: 22px; }
/* 收起來的按鈕：高度和間距一起縮成 0，另一顆往下補位，不會留一個空格 */
.fab button { transition: opacity .18s ease, transform .22s ease, height .22s ease, margin-top .22s ease; }
.fab button.is-off { height: 0; margin-top: 0; opacity: 0; transform: scale(.4); visibility: hidden; pointer-events: none; border-width: 0; box-shadow: none; transition: opacity .14s ease, transform .22s ease, height .22s ease, margin-top .22s ease, visibility 0s linear .22s, border-width 0s linear .22s, box-shadow 0s linear .22s; }
@media (prefers-reduced-motion: reduce) { .fab button, .fab button.is-off { transition: none; } }
main.wrap { padding-bottom: 140px; }

<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="dday" aria-label="距離筆試天數"><span>D−</span><b id="dday">--</b></div>
      <div class="title-block">
        <h1 id="exam-title">資工所備考計畫</h1>
        <p id="exam-sub"></p>
      </div>
      <div class="exam-pick" id="exam-pick" hidden>
        <label for="exam-select" class="eyebrow">考試</label>
        <select id="exam-select"></select>
      </div>
      <div class="acct" id="acct"></div>
    </div>
    <nav class="tabs" aria-label="頁面">
      <a href="#today">今日</a>
      <a href="#notes">教材</a>
      <a href="#plan">每日行程</a>
      <a href="#papers">考古題進度</a>
      <a href="#strategy">上榜策略</a>
      <a href="#resources">教材與來源</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-notes" hidden></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-papers" hidden></section>
  <section class="view" id="v-strategy" hidden></section>
  <section class="view" id="v-resources" hidden></section>
</main>

<div class="fab">
  <button type="button" data-go="top" aria-label="回到最上面" title="回到最上面"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14"/><path d="M12 20V9"/><path d="M7 13.5l5-5 5 5"/></svg></button>
  <button type="button" data-go="bottom" aria-label="到最下面" title="到最下面"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19.5h14"/><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/></svg></button>
</div>

<!-- 考試資料：每個考試一個檔案，新增考試就在這裡多加一行 -->
<script src="data/nsysu-cse-116.js"></script>

<script>
(function () {
  "use strict";
  var EXAMS = window.EXAMS || [];
  var WD = ["日", "一", "二", "三", "四", "五", "六"];
  var VIEWS = ["today", "notes", "plan", "papers", "strategy", "resources"];

  /* ---------- storage (per-browser convenience; safe if blocked) ---------- */
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} if (window.CGEP_STATE) window.CGEP_STATE.touch(key); }

  /* ---------- dates (local, date-only) ---------- */
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function diff(a, b) { return Math.round((b - a) / 86400000); }
  function md(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
  function todayDate() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // 內文裡的 ★（錯題本記號）畫成 SVG，不用 emoji 字型
  var STAR = '<svg class="ico ico-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4L4.2 9.7l5.4-.8z" fill="currentColor"/></svg>';
  function rich(s) { return esc(s).replace(/★/g, STAR); }

  /* ---------- exam selection ---------- */
  var params = new URLSearchParams(location.search);
  var exam = EXAMS.filter(function (e) { return e.id === (params.get("exam") || load("cgep:exam", "")); })[0] || EXAMS[EXAMS.length - 1];
  if (!exam) { document.querySelector("main").innerHTML = "<p>找不到考試資料（data/*.js）。</p>"; return; }
  var K = "cgep:" + exam.id + ":";
  var subjMap = {}; exam.subjects.forEach(function (s) { subjMap[s.key] = s; });
  var srcList = exam.sources || [];

  var state = {};
  // 每個人自己的開始日期（第一次用網站那天）。沒存過時：已經有打勾紀錄的人從計畫原本的第一天算，
  // 新的人從今天算。這個預設值只寫進這台裝置、不標修改時間，雲端如果已經有（別台裝置存的）就以雲端為準。
  function loadState() {
    state.rest = load(K + "rest", null);
    state.done = load(K + "done", {});
    state.papers = load(K + "papers", {});
    state.start = load(K + "start", null);
    if (!state.start || !/^\d{4}-\d{2}-\d{2}$/.test(state.start)) {
      var any = Object.keys(state.done).length > 0;
      state.start = any || todayDate() <= parse(exam.start) ? exam.start : iso(todayDate());
      try { localStorage.setItem(K + "start", JSON.stringify(state.start)); } catch (e) {}
    }
  }
  loadState();

  /* ---------- schedule builder：依開始日期選計畫，讀書天不夠就一層一層壓縮 ---------- */
  var baseById = {}; exam.days.forEach(function (d) { baseById[d.id] = d; });
  function trackFor(R) {
    var ts = (exam.tracks || []).slice().sort(function (a, b) { return b.min - a.min; });
    return ts.filter(function (t) { return R >= t.min; })[0] || null;
  }
  function partsOf(t) { return t.parts || [t.id]; }
  // 速讀日的標題只列主題：「計數：A」→「計數」；「資結：C 程式：A」→「C 程式」
  function topicOf(title) { var t = title.replace(/^(OS|資結)：/, ""), m = t.match(/^([^：]+)：/); return m ? m[1] : t; }
  // 「計數：A」「計數：B」→「計數：A＋B」
  function joinTitles(ts) {
    var out = [], prev = null;
    ts.forEach(function (t) {
      var m = t.match(/^([^：]+)：(.+)$/);
      if (m && prev === m[1]) out.push(m[2]); else out.push(t);
      prev = m ? m[1] : null;
    });
    return out.join("＋");
  }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
  // 幾天併成一天：每科的區塊合在一起。group（打底期）用「先做小考、錯了才讀」的讀法
  function mergeTasks(list, opt) {
    var order = [], by = {}, parts = [], n = 0;
    list.forEach(function (t) {
      parts = parts.concat(partsOf(t));
      t.blocks.forEach(function (b) { if (!by[b.subject]) { by[b.subject] = []; order.push(b.subject); } by[b.subject].push(b); });
    });
    n = parts.length;
    var blocks = order.map(function (sj) {
      var bs = by[sj], b0 = bs[0], link = (bs.filter(function (b) { return b.link; })[0] || {}).link;
      var reads = bs.map(function (b) { return b.read; }).filter(Boolean), pr = bs.map(function (b) { return b.practice; }).filter(Boolean);
      if (!opt.group) return { subject: sj, time: b0.time, title: joinTitles(bs.map(function (b) { return b.title; })), read: reads.join("；"), practice: pr.join("；"), link: link };
      if (n <= 2) return { subject: sj, time: b0.time, title: joinTitles(bs.map(function (b) { return b.title; })), read: "先做這 " + n + " 節的小考（限時），錯了才讀：" + reads.join("；"), practice: pr.join("；"), link: link };
      var tp = uniq(bs.map(function (b) { return topicOf(b.title); }));
      return { subject: sj, time: b0.time, title: (tp.length > 4 ? tp.slice(0, 4).join("、") + " 等 " + tp.length + " 個主題" : tp.join("、")) + "（速讀）", read: "只讀 ★★★ 主題：先做各小節的小考（限時），錯的才回去讀觀念課；★ 主題先跳過", practice: "每個小節的小考", link: link };
    });
    return {
      id: "m-" + parts.join("-"), parts: parts, phase: list[0].phase,
      title: opt.title || blocks.map(function (b) { return b.title; }).join("｜"),
      tag: opt.tag || "併 " + n + " 天", blocks: blocks, review: list[0].review,
      note: opt.group ? (n <= 2 ? "兩天的內容併成一天：先做小考，寫錯的小節才回去讀。" : n + " 天的內容併成一天：只讀 ★★★ 主題，其他的考古題期遇到再回頭看。") : ""
    };
  }
  function applyLevel(tasks, L) {
    var out = tasks.slice();
    if (L.group) {
      var set = {}; L.group.ids.forEach(function (id) { set[id] = 1; });
      var base = L.group.ids.map(function (id) { return baseById[id]; }).filter(Boolean), groups = [];
      for (var i = 0; i < base.length; i += L.group.size) groups.push(mergeTasks(base.slice(i, i + L.group.size), { group: true }));
      var inF = function (t) { return partsOf(t).every(function (x) { return set[x]; }); };
      var at = out.findIndex(inF);
      if (at >= 0) { out = out.filter(function (t) { return !inF(t); }); Array.prototype.splice.apply(out, [at, 0].concat(groups)); }
    }
    (L.merge || []).forEach(function (m) {
      var list = out.filter(function (t) { return m.ids.indexOf(t.id) >= 0; });
      if (list.length < 2) return;
      var at = out.indexOf(list[0]);
      out = out.filter(function (t) { return m.ids.indexOf(t.id) < 0; });
      out.splice(at, 0, mergeTasks(list, { title: m.title, tag: m.tag }));
    });
    // 拿掉：原本的那一天，或是全部由這些天併成的天
    if (L.drop) out = out.filter(function (t) { return !partsOf(t).every(function (x) { return L.drop.indexOf(x) >= 0; }); });
    return out;
  }
  function bufferDay(n) {
    return { id: "buf" + n, phase: "sprint", title: "彈性日：補進度或錯題重做", tag: "彈性",
      blocks: exam.subjects.map(function (s, j) { return { subject: s.key, time: ["上午", "下午", "晚上"][j] || "", title: s.short + "：補落後進度", read: "沒落後就重做錯題本 ★★ 題目", practice: "" }; }) };
  }
  // N 個讀書天：太多就照 exam.compress 一層一層壓縮；太少就在最後 3 天前補彈性日
  function fitTasks(N) {
    var levels = exam.compress || [{ label: "取消選做日", drop: exam.days.filter(function (d) { return d.optional; }).map(function (d) { return d.id; }) }];
    var tasks = exam.days.slice(), applied = [], extra = 0;
    levels.forEach(function (L) { if (tasks.length > N) { tasks = applyLevel(tasks, L); applied.push(L.label); } });
    while (tasks.length < N) { extra++; tasks.splice(Math.max(0, tasks.length - 3), 0, bufferDay(extra)); }
    return { tasks: tasks, applied: applied, extra: extra, overflow: Math.max(0, tasks.length - N) };
  }
  function build() {
    var start = parse(state.start), examD = parse(exam.examDate);
    var R = Math.max(0, diff(start, examD)), track = trackFor(R);
    var rest = state.rest || (track && track.rest) || exam.defaultRest;
    var pinned = {}; (exam.pinned || []).forEach(function (p) { pinned[p.date] = p; });
    var slots = [];
    for (var d = new Date(start); d < examD; d = addDays(d, 1)) {
      var k = iso(d);
      if (pinned[k]) slots.push({ date: new Date(d), task: pinned[k] });
      else if (rest.indexOf(d.getDay()) >= 0) slots.push({ date: new Date(d), rest: true });
      else slots.push({ date: new Date(d), open: true });
    }
    var open = slots.filter(function (s) { return s.open; });
    var fit = fitTasks(open.length);
    open.forEach(function (s, j) { s.task = fit.tasks[j]; delete s.open; });
    slots = slots.filter(function (s) { return !s.open || s.task; });
    slots.push({ date: examD, exam: true });
    var byId = {}; slots.forEach(function (s) { if (s.task) byId[s.task.id] = s.task; });
    return { slots: slots, R: R, track: track, rest: rest, applied: fit.applied, extra: fit.extra, overflow: fit.overflow, tasks: fit.tasks, byId: byId };
  }
  // 併起來的天：自己打勾，或原本的每一天都打過勾，都算完成（換開始日期、計畫重排後紀錄不會不見）
  function isDone(t) { return !!state.done[t.id] || !!(t.parts && t.parts.every(function (x) { return state.done[x]; })); }
  function setDone(t, on) {
    [t.id].concat(t.parts || []).forEach(function (x) { if (on) state.done[x] = 1; else delete state.done[x]; });
    save(K + "done", state.done);
  }

  var plan = build();
  var msByDate = {}; (exam.milestones || []).forEach(function (m) { (msByDate[m.date] = msByDate[m.date] || []).push(m); });
  function phaseOf(id) { return exam.phases.filter(function (p) { return p.id === id; })[0] || { name: id }; }

  /* ---------- header ---------- */
  var T = todayDate(), examD = parse(exam.examDate);
  document.getElementById("dday").textContent = Math.max(0, diff(T, examD));
  document.getElementById("exam-title").textContent = exam.label;
  document.getElementById("exam-sub").textContent = "筆試 " + exam.examDate.replace(/-/g, "/") + "（" + WD[examD.getDay()] + "）・" + exam.subjects.map(function (s) { return s.name; }).join("、");
  document.title = exam.label.split("・")[0] + "備考計畫";
  if (EXAMS.length > 1) {
    var sel = document.getElementById("exam-select");
    sel.innerHTML = EXAMS.map(function (e) { return '<option value="' + esc(e.id) + '"' + (e.id === exam.id ? " selected" : "") + ">" + esc(e.label) + "</option>"; }).join("");
    sel.addEventListener("change", function () { save("cgep:exam", sel.value); location.search = "?exam=" + encodeURIComponent(sel.value); });
    document.getElementById("exam-pick").hidden = false;
  }

  function subjChip(key, withWeak) {
    var s = subjMap[key]; if (!s) return "";
    return '<span class="subj" data-s="' + esc(key) + '">' + esc(s.short) + (withWeak && s.weak ? ' <span class="weak-mark">弱科</span>' : "") + "</span>";
  }
  function taskSlots() { return plan.slots.filter(function (s) { return s.task; }); }
  function stats() {
    var ts = taskSlots(), done = 0, due = 0, dueDone = 0;
    ts.forEach(function (s) {
      var ok = isDone(s.task);
      if (ok) done++;
      if (s.date < T) { due++; if (ok) dueDone++; }
    });
    return { total: ts.length, done: done, behind: due - dueDone };
  }

  /* ---------- TODAY ---------- */
  function renderBlocks(task) {
    return '<div class="blocks">' + task.blocks.map(function (b) {
      return '<div class="block"><div class="when"><span>' + esc(b.time) + "</span>" + subjChip(b.subject, true) + '</div><div class="what"><h4>' + esc(b.title) + "</h4><dl>" +
        (b.read ? "<dt>讀</dt><dd>" + rich(b.read) + "</dd>" : "") + (b.practice ? "<dt>練</dt><dd>" + rich(b.practice) + "</dd>" : "") + "</dl>" + (b.link ? '<a class="nlink" href="' + esc(b.link) + '">開教材 →</a>' : "") + "</div></div>";
    }).join("") + "</div>";
  }
  function renderReview(t) {
    if (!t.review || !t.review.length) return "";
    return '<div class="review"><div class="eyebrow">間隔複習・睡前 30 分鐘</div><ul>' + t.review.map(function (r) {
      var tx = r.link ? '<a href="' + esc(r.link) + '">' + esc(r.text) + "</a>" : esc(r.text);
      return "<li>" + (r.subject ? subjChip(r.subject) : '<span class="subj" data-s="method">錯題</span>') + "<span>" + tx + "</span></li>";
    }).join("") + "</ul></div>";
  }
  function renderToday() {
    var el = document.getElementById("v-today");
    var st = stats();
    var slot = plan.slots.filter(function (s) { return iso(s.date) === iso(T); })[0];
    var label = "今天";
    if (!slot) {
      if (T < parse(state.start)) { slot = plan.slots[0]; label = "第一天"; }
      else slot = plan.slots[plan.slots.length - 1];
    }
    var html = "";
    var cur = slot.task ? slot.task.phase : null;
    html += '<div class="facts">' +
      '<div class="fact"><div class="v">' + st.done + " / " + st.total + '</div><div class="k">已完成讀書天</div></div>' +
      '<div class="fact"><div class="v ' + (st.behind > 0 ? "behind" : "good") + '">' + (st.behind > 0 ? "落後 " + st.behind + " 天" : "進度正常") + '</div><div class="k">以今天之前的行程計算</div></div>' +
      '<div class="fact"><div class="v"><a class="plan-link" href="#plan">' + esc(plan.track ? plan.track.name : "行程") + '</a></div><div class="k">從 ' + md(parse(state.start)) + " 開始・距離筆試 " + plan.R + " 天・每週休 " + plan.rest.length + " 天</div></div>" +
      "</div>";

    if (slot.exam) {
      html += '<div class="rest-card"><div class="eyebrow">' + md(slot.date) + "（" + WD[slot.date.getDay()] + '）</div><h2 style="margin-top:8px">考試日，加油</h2><p class="lede">帶准考證、身分證、文具。每科寫完先檢查計算題的單位和進位。</p></div>';
    } else if (slot.rest) {
      var next = plan.slots.filter(function (s) { return s.date > slot.date && s.task; })[0];
      html += '<div class="rest-card"><div class="eyebrow">' + label + "・" + md(slot.date) + "（" + WD[slot.date.getDay()] + '）</div><h2 style="margin-top:8px">休息日</h2><p class="lede" style="margin:0">好好休息。睡前可以花 15 分鐘翻錯題本，其他時間不要讀書。' +
        (next ? "下一個讀書天是 " + md(next.date) + "（" + WD[next.date.getDay()] + "）：" + esc(next.task.title) + "。" : "") + "</p></div>";
    } else {
      var t = slot.task, done = isDone(t);
      html += '<div class="today-card"><div class="today-head"><div><div class="date">' + label + "・" + iso(slot.date).replace(/-/g, "/") + "（" + WD[slot.date.getDay()] + "）・" + esc(phaseOf(t.phase).name) + "期</div><h3>" + esc(t.title) + '</h3></div><button class="done-btn" id="today-done" aria-pressed="' + done + '">' + (done ? '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>今天完成了' : "標記今天完成") + "</button></div>" +
        renderBlocks(t) + (t.note ? '<p class="note">' + esc(t.note) + "</p>" : "") + renderReview(t) +
        '<p class="flow">每個區塊的流程：<b>10 分鐘</b>白紙回想昨天 → <b>讀</b>觀念課與例題 → <b>練</b>小考與考古題（限時） → <b>訂正</b>寫錯因進錯題本。<a href="notes/method.html#daily">為什麼這樣排</a></p></div>';
    }

    var late = overdue();
    if (late.length && !slot.exam) html += renderCatchup(late);

    // milestones
    var ms = exam.milestones || [];
    var nextIdx = ms.findIndex(function (m) { return parse(m.date) >= T; });
    html += "<div><h2>重要日期</h2><ol class=\"ms-list\">" + ms.map(function (m, i) {
      var d = parse(m.date);
      return '<li class="' + (d < T ? "past" : i === nextIdx ? "next" : "") + '"><span class="d">' + iso(d).replace(/-/g, "/") + "（" + WD[d.getDay()] + "）</span><span>" + esc(m.label) + "</span></li>";
    }).join("") + "</ol></div>";

    // phases
    var counts = exam.phases.map(function (p) { return { p: p, n: plan.slots.filter(function (s) { return s.task && s.task.phase === p.id; }).length }; });
    var curIdx = exam.phases.findIndex(function (p) { return p.id === cur; });
    html += "<div><h2>階段</h2><div class=\"phasebar\">" + counts.map(function (c, i) {
      return '<div style="flex:' + c.n + '" class="' + (i === curIdx ? "cur" : i < curIdx ? "past" : "") + '" title="' + esc(c.p.name) + '"></div>';
    }).join("") + '</div><div class="phase-legend">' + counts.map(function (c) { return "<span><b>" + esc(c.p.name) + "</b> " + c.n + " 天・" + esc(c.p.desc) + "</span>"; }).join("") + "</div></div>";

    el.innerHTML = html;
    var btn = document.getElementById("today-done");
    if (btn) btn.addEventListener("click", function () { setDone(slot.task, !isDone(slot.task)); renderToday(); renderPlan(); });
    el.querySelectorAll(".cu-chk").forEach(function (c) {
      c.addEventListener("change", function () { var t = plan.byId[c.dataset.id]; if (t) setDone(t, c.checked); renderToday(); renderPlan(); });
    });
  }


  /* ---------- 補進度 ---------- */
  // 今天以前還沒打勾的讀書天
  function overdue() { return taskSlots().filter(function (s) { return s.date < T && !isDone(s.task); }); }
  // 補進度的時段：從今天起每週第一個休息日（另一個休息日照常休息），加上還沒做的選做日。
  // 一個時段補 2 天：用「先做題、錯了才讀」的方式，一天的量大約半天補得完。
  // 不把整個行程往後推：後面的考古題期和衝刺期不能被壓縮。
  function catchup(list) {
    var seen = {}, slots = [];
    function week(d) { return iso(addDays(d, -((d.getDay() + 6) % 7))); }
    plan.slots.forEach(function (s) {
      if (s.date < T || s.exam) return;
      if (s.rest) {
        var wk = week(s.date);
        if (seen[wk]) return;
        seen[wk] = 1;
        // 同一週後面還有休息日的話，告訴使用者那天照常休息
        var other = plan.slots.filter(function (x) { return x.rest && x.date > s.date && week(x.date) === wk; })[0];
        slots.push({ date: s.date, kind: "休息日" + (other ? "（" + md(other.date) + "照常休息）" : "") });
      } else if (s.task && s.task.optional && !isDone(s.task) && iso(s.date) !== iso(T)) {
        slots.push({ date: s.date, kind: "選做日：原本的「" + s.task.title.split("｜")[0] + "」先不做" });
      }
    });
    slots.sort(function (a, b) { return a.date - b.date; });
    var i = 0, rows = [];
    slots.forEach(function (sl) {
      if (i >= list.length) return;
      rows.push({ slot: sl, items: list.slice(i, i + 2) });
      i += 2;
    });
    return { rows: rows, left: Math.max(0, list.length - i) };
  }
  function renderCatchup(late) {
    var cu = catchup(late);
    function item(s) {
      return '<li><label class="cu-item"><input type="checkbox" class="cu-chk" data-id="' + esc(s.task.id) + '" aria-label="' + md(s.date) + ' 補完了"><span><b>' + md(s.date) + "（" + WD[s.date.getDay()] + "）</b>" + esc(s.task.title) + "</span></label>" +
        '<div class="cu-links">' + s.task.blocks.map(function (b) { return b.link ? '<a href="' + esc(b.link) + '">' + subjChip(b.subject) + "<span>" + esc(b.title) + "</span></a>" : ""; }).join("") + "</div></li>";
    }
    function row(r) {
      var d = r.slot.date, when = iso(d) === iso(T) ? "今天" : md(d) + "（" + WD[d.getDay()] + "）";
      return '<li><div class="cu-when"><b>' + when + "</b><span>" + esc(r.slot.kind) + '</span></div><ul class="cu-list">' + r.items.map(item).join("") + "</ul></li>";
    }
    var h = '<div class="catchup" id="catchup"><div><div class="eyebrow">補進度</div><h3>落後 ' + late.length + " 天，照這個順序補</h3></div>" +
      '<p class="cu-rule"><b>今天的行程照常做</b>，落後的天數排進下面的時段，一個時段補 2 天。補的時候<b>先寫那天的小考和考古題（限時）</b>，寫錯或寫不出來的部分才回去讀教材，補完一天就打勾。</p>';
    var first = cu.rows.slice(0, 3), more = cu.rows.slice(3);
    h += '<ol class="cu-plan">' + first.map(row).join("") + "</ol>";
    if (more.length) h += "<details><summary>後面還有 " + more.length + " 個時段</summary>" + '<ol class="cu-plan">' + more.map(row).join("") + "</ol></details>";
    if (cu.left) h += '<p class="cu-left">還有 ' + cu.left + " 天排不進來（考前的休息日和選做日都用完了）：每天晚上多做 1 個區塊（約 1.5 小時），只做那幾天的 ★★★ 題目和小考，大約 " + cu.left * 3 + " 天補完。</p>";
    h += '<p class="cu-more"><a href="notes/method.html#catchup">時間不夠時先補什麼、可以跳過什麼</a></p></div>';
    return h;
  }

  /* ---------- NOTES ---------- */
  function renderNotes() {
    var el = document.getElementById("v-notes"), list = exam.notes || [];
    if (!list.length) { el.innerHTML = "<p>這個考試還沒有教材。</p>"; return; }
    var html = '<div><h2>教材</h2><p class="lede">從 111–115 年考古題逐題拆出來的教材。每個單元先用觀念課從小例子講起，再接公式整理、考古題詳解和小考；小考的對錯會記在這台裝置的瀏覽器裡，下面顯示進度。建議先讀「學習方法」。</p></div><div class="ncards">';
    list.forEach(function (n) {
      var rec = load("cgep:quiz:" + n.slug, {}), done = 0, wrong = 0;
      Object.keys(rec).forEach(function (k) { done++; if (rec[k] === 0) wrong++; });
      html += '<a class="ncard" href="' + esc(n.url) + '">' + (n.subject ? subjChip(n.subject, true) : '<span class="subj" data-s="method">方法</span>') +
        "<h3>" + esc(n.title) + "</h3><p>" + esc(n.desc) + '</p><span class="nprog mono">' + (done ? "小考已作答 " + done + " 題・答錯 " + wrong + " 題" : "還沒開始") + "</span></a>";
    });
    html += "</div>";
    el.innerHTML = html;
  }

  /* ---------- PLAN ---------- */
  function renderPlan() {
    var el = document.getElementById("v-plan");
    var tr = plan.track, studyDays = taskSlots().length;
    var html = '<div><h2>每日行程</h2><p class="lede">行程從你的開始日期排到考前一天，剩下的天數決定用哪一種計畫。上午、下午、晚上各約 3、3、2.5 小時；換開始日期或休息日時會重新排，打勾的進度不會不見。</p></div>';
    html += '<div class="myplan"><div class="mp-top"><div><div class="eyebrow">你的計畫</div><h3>' + esc(tr ? tr.name : "行程") + "</h3>" +
      '<p class="mp-sub">從 ' + md(parse(state.start)) + "（" + WD[parse(state.start).getDay()] + "）開始・距離筆試 " + plan.R + " 天・讀書 " + studyDays + " 天・每週休 " + plan.rest.length + " 天</p></div>" +
      '<label class="mp-start"><span>開始日期</span><input type="date" id="start-date" value="' + esc(state.start) + '" max="' + iso(addDays(parse(exam.examDate), -7)) + '"></label></div>' +
      (tr ? '<p class="mp-desc">' + rich(tr.desc) + "</p>" : "") +
      (plan.applied.length ? '<details class="mp-adj"><summary>這份計畫做了 ' + plan.applied.length + " 項調整</summary><ol>" + plan.applied.map(function (a) { return "<li>" + rich(a) + "</li>"; }).join("") + "</ol></details>" : "") +
      '<details class="mp-adj"><summary>各階段的計畫（依剩下的天數）</summary><ul class="mp-tracks">' + (exam.tracks || []).map(function (x) {
        return '<li class="' + (tr && x.id === tr.id ? "cur" : "") + '"><b>' + esc(x.name) + "</b><span>" + (x.min ? x.min + " 天以上" : "") + "</span><p>" + rich(x.desc) + "</p></li>";
      }).join("") + "</ul></details></div>";
    html += '<div class="toolbar"><span class="lbl">休息日</span><div class="wd-pick" role="group" aria-label="選擇每週休息日">' +
      WD.map(function (w, i) { return '<button type="button" data-wd="' + i + '" aria-pressed="' + (plan.rest.indexOf(i) >= 0) + '" aria-label="星期' + w + '">' + w + "</button>"; }).join("") +
      '</div><button type="button" class="btn" id="jump-today">跳到今天</button>' +
      '<span class="tb-msg">' + (plan.overflow ? "天數不夠，有 " + plan.overflow + " 天行程排不進去，建議減少休息日。" : plan.extra ? "多出 " + plan.extra + " 天彈性日。" : "") + "</span></div>";

    // group by week (Mon-start)
    var weeks = [], cur = null;
    plan.slots.forEach(function (s) {
      var dow = (s.date.getDay() + 6) % 7, mon = iso(addDays(s.date, -dow));
      if (!cur || cur.key !== mon) { cur = { key: mon, items: [] }; weeks.push(cur); }
      cur.items.push(s);
    });
    weeks.forEach(function (w, wi) {
      var phases = []; w.items.forEach(function (s) { if (s.task) { var n = phaseOf(s.task.phase).name; if (phases.indexOf(n) < 0) phases.push(n); } });
      var first = w.items[0].date, last = w.items[w.items.length - 1].date;
      html += '<div class="week"><div class="week-h"><span class="eyebrow">第 ' + (wi + 1) + " 週・" + md(first) + "–" + md(last) + '</span><span class="pc">' + esc(phases.join(" → ")) + '</span></div><div class="days">';
      w.items.forEach(function (s) {
        var k = iso(s.date), ms = msByDate[k] || [];
        var msTags = ms.map(function (m) { return '<span class="tag ms">' + esc(m.label.split("：")[0].split("（")[0]) + "</span>"; }).join("");
        var dt = '<div class="dt">' + md(s.date) + "<small>星期" + WD[s.date.getDay()] + "</small></div>";
        var isToday = k === iso(T) ? " is-today" : "";
        if (s.exam) {
          html += '<div class="day exam" id="day-' + k + '"><span></span>' + dt + '<div class="main"><div class="t">筆試日</div><div>' + esc(exam.subjects.map(function (x) { return x.name; }).join("・")) + "</div></div></div>";
        } else if (s.rest) {
          html += '<div class="day rest' + isToday + '" id="day-' + k + '"><span></span>' + dt + '<div class="main">休息' + (msTags ? " " + msTags : "") + "</div></div>";
        } else {
          var t = s.task, d = isDone(t), late = !d && s.date < T;
          html += '<div class="day' + (d ? " done" : "") + (late ? " late" : "") + isToday + '" id="day-' + k + '"><input type="checkbox" class="chk" id="c-' + esc(t.id) + '" data-id="' + esc(t.id) + '"' + (d ? " checked" : "") + ' aria-label="' + md(s.date) + ' 完成">' + dt +
            '<div class="main"><div class="t">' + esc(t.title) + (late ? ' <span class="tag late">落後</span>' : "") + (t.tag ? ' <span class="tag">' + esc(t.tag) + "</span>" : "") + (t.optional ? ' <span class="tag opt">選做</span>' : "") + msTags + '</div><div class="items">' +
            t.blocks.map(function (b) { var tt = b.link ? '<a href="' + esc(b.link) + '">' + esc(b.title) + "</a>" : esc(b.title); return "<div>" + subjChip(b.subject) + "<span>" + tt + (b.practice ? "・" + rich(b.practice) : "") + "</span></div>"; }).join("") +
            "</div>" + (t.note ? '<div style="font-size:13px;color:var(--muted)">' + esc(t.note) + "</div>" : "") +
            (t.review && t.review.length ? '<div class="rv-line">複習：' + t.review.map(function (r) { return esc(r.text.replace(/（.*?）/g, "")); }).join("；") + "</div>" : "") + "</div></div>";
        }
      });
      html += "</div></div>";
    });
    el.innerHTML = html;

    el.querySelectorAll(".wd-pick button").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!state.rest) state.rest = plan.rest.slice();
        var i = +b.dataset.wd, at = state.rest.indexOf(i);
        if (at >= 0) state.rest.splice(at, 1); else state.rest.push(i);
        save(K + "rest", state.rest);
        plan = build(); renderPlan(); renderToday();
      });
    });
    el.querySelectorAll(".chk").forEach(function (c) {
      c.addEventListener("change", function () { var t = plan.byId[c.dataset.id]; if (t) setDone(t, c.checked); c.closest(".day").classList.toggle("done", c.checked); c.closest(".day").classList.remove("late"); renderToday(); });
    });
    document.getElementById("start-date").addEventListener("change", function (e) {
      var v = e.target.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || parse(v) >= addDays(parse(exam.examDate), -6)) { e.target.value = state.start; return; }
      state.start = v; save(K + "start", v);
      plan = build(); renderPlan(); renderToday();
    });
    document.getElementById("jump-today").addEventListener("click", function () {
      var t = document.getElementById("day-" + iso(T)) || document.querySelector(".day");
      if (t) t.scrollIntoView({ block: "center" });
    });
  }

  /* ---------- PAPERS ---------- */
  var ST = ["未做", "做完", "已訂正", "二刷完"];
  function renderPapers() {
    var el = document.getElementById("v-papers"), P = exam.papers || { years: [] }, roles = P.roles || {};
    var cnt = [0, 0, 0, 0];
    P.years.forEach(function (y) { exam.subjects.forEach(function (s) { cnt[state.papers[y + ":" + s.key] || 0]++; }); });
    var total = P.years.length * exam.subjects.length;
    var html = '<div><h2>考古題進度</h2><p class="lede">點圓圈切換狀態：未做 → 做完 → 已訂正 → 二刷完。' + esc(P.note || "") + "</p>" +
      '<div class="legend">' + ST.map(function (n, i) { return '<span><button class="bubble" data-st="' + i + '" tabindex="-1" aria-hidden="true"></button>' + n + "</span>"; }).join("") +
      '<span class="mono">已訂正以上 ' + (cnt[2] + cnt[3]) + " / " + total + "</span></div></div>";
    html += '<div class="sheet-wrap"><table class="sheet"><thead><tr><th>年度</th>' + exam.subjects.map(function (s) { return "<th>" + subjChip(s.key, true) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      P.years.map(function (y) {
        return '<tr><td><span class="yr">' + y + "</span>" + (roles[y] ? '<span class="role">' + esc(roles[y]) + "</span>" : "") + "</td>" +
          exam.subjects.map(function (s) {
            var k = y + ":" + s.key, v = state.papers[k] || 0;
            return '<td><button class="bubble" data-k="' + esc(k) + '" data-st="' + v + '" aria-label="' + y + " 年 " + esc(s.name) + "：" + ST[v] + '"></button></td>';
          }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
    if (exam.links && exam.links.length) html += '<div><h3>考古題與官方連結</h3><ul class="src-list">' + exam.links.map(function (l) { return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + "</a></li>"; }).join("") + "</ul></div>";
    el.innerHTML = html;
    el.querySelectorAll(".sheet .bubble").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = ((state.papers[b.dataset.k] || 0) + 1) % 4;
        if (v) state.papers[b.dataset.k] = v; else delete state.papers[b.dataset.k];
        save(K + "papers", state.papers); renderPapers();
        var again = el.querySelector('.bubble[data-k="' + b.dataset.k + '"]'); if (again) again.focus();
      });
    });
  }

  /* ---------- STRATEGY ---------- */
  function renderStrategy() {
    var el = document.getElementById("v-strategy");
    var html = '<div><h2>上榜策略</h2><p class="lede">' + esc(exam.weights) + "</p><div class=\"subjects-row\">" + exam.subjects.map(function (s) { return subjChip(s.key, true) + '<span style="font-size:13px">' + esc(s.name) + "</span>"; }).join("") + "</div></div>";
    html += '<div class="strat">' + (exam.strategy || []).map(function (s, i) {
      var src = (s.src || []).map(function (j) { var x = srcList[j]; return x ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label) + "</a>" : ""; }).filter(Boolean).join("、");
      return '<article><div class="n">' + String(i + 1).padStart(2, "0") + "</div><div><h3>" + esc(s.title) + "</h3><p>" + esc(s.body) + "</p>" + (src ? '<div class="src">來源：' + src + "</div>" : "") + "</div></article>";
    }).join("") + "</div>";
    el.innerHTML = html;
  }

  /* ---------- RESOURCES ---------- */
  function renderResources() {
    var el = document.getElementById("v-resources");
    var html = '<div><h2>教材</h2><p class="lede">每科一本主教材加一本題庫就夠了，時間不夠時不要換書。</p><div class="res">' + (exam.resources || []).map(function (r) {
      return "<div>" + subjChip(r.subject, true) + "<ul>" + r.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
    }).join("") + "</div></div>";
    html += '<div><h2>資料來源</h2><p class="lede">考科、日期與計分方式整理自以下資料。日期都是「預定」，請以正式簡章為準。</p><ul class="src-list">' +
      srcList.map(function (s) { return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + "</a></li>"; }).join("") + "</ul></div>";
    el.innerHTML = html;
  }

  /* ---------- routing ---------- */
  function route() {
    var v = (location.hash || "#today").slice(1);
    if (VIEWS.indexOf(v) < 0) v = "today";
    VIEWS.forEach(function (n) { document.getElementById("v-" + n).hidden = n !== v; });
    document.querySelectorAll("nav.tabs a").forEach(function (a) { if (a.getAttribute("href") === "#" + v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  }
  renderToday(); renderNotes(); renderPlan(); renderPapers(); renderStrategy(); renderResources();
  window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
  // 已經在最上面／最下面時，對應的按鈕藏起來
  var fabEl = document.querySelector(".fab"), fabTick = 0;
  function fabEdge() {
    fabTick = 0;
    var y = window.scrollY, max = document.documentElement.scrollHeight - window.innerHeight;
    fabEl.querySelector('[data-go="top"]').classList.toggle("is-off", y < 24);
    fabEl.querySelector('[data-go="bottom"]').classList.toggle("is-off", y > max - 24);
  }
  function fabSoon() { if (!fabTick) fabTick = requestAnimationFrame(fabEdge); }
  window.addEventListener("scroll", fabSoon, { passive: true });
  window.addEventListener("resize", fabSoon);
  window.addEventListener("hashchange", function () { setTimeout(fabSoon, 50); });
  document.addEventListener("click", function () { setTimeout(fabSoon, 50); }, true);
  fabSoon();
  document.querySelector(".fab").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var glide = window.CGEP_GLIDE || function (y) { window.scrollTo(0, typeof y === "function" ? y() : y); };
    glide(b.dataset.go === "top" ? 0 : function () { return document.documentElement.scrollHeight - window.innerHeight; });
  });
  // 雲端同步下來新的進度，或換了帳號：重新讀進度、重畫
  document.addEventListener("cgep:state-remote", function () {
    loadState();
    plan = build();
    renderToday(); renderNotes(); renderPlan(); renderPapers();
    fabSoon();
  });
  route();
})();
</script>
